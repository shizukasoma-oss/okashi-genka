<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お菓子原価計算</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8763a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="原価計算">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: #fdf6f0;
    color: #3d2b1f;
    min-height: 100vh;
  }
  header {
    background: #c8763a;
    color: white;
    padding: 14px 16px;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
  }
  header span { font-size: 0.85rem; font-weight: normal; opacity: .85; margin-left: 8px; }
  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 2px solid #e8d5c4;
    position: sticky;
    top: 50px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 2px;
    border: none;
    background: none;
    font-size: 0.75rem;
    color: #9a7c6a;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .2s;
    font-family: inherit;
    line-height: 1.3;
  }
  .tab-btn.active { color: #c8763a; border-bottom-color: #c8763a; font-weight: bold; }
  .tab-panel { display: none; padding: 16px; max-width: 640px; margin: 0 auto; }
  .tab-panel.active { display: block; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .card-title {
    font-size: 0.9rem;
    font-weight: bold;
    color: #c8763a;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  label { display: block; font-size: 0.8rem; color: #7a5c4a; margin-bottom: 3px; margin-top: 10px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], input[type=date], input[type=email], select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fafafa;
    color: #3d2b1f;
    transition: border .15s;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, input[type=email]:focus, select:focus {
    outline: none; border-color: #c8763a; background: white;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: .75; }
  .btn-primary { background: #c8763a; color: white; }
  .btn-secondary { background: #e8d5c4; color: #5a3e30; }
  .btn-danger { background: #e57373; color: white; }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; border-radius: 6px; }
  .btn-full { width: 100%; margin-top: 12px; }
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0e8e0;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-info { flex: 1; min-width: 0; }
  .list-item-name { font-weight: bold; font-size: 0.95rem; }
  .list-item-sub { font-size: 0.78rem; color: #9a7c6a; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 8px; }
  .recipe-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .recipe-row select, .recipe-row input { font-size: 0.85rem; }
  .pkg-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .pkg-row select, .pkg-row input { font-size: 0.85rem; }
  .session-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .session-row select { font-size: 0.85rem; }
  .session-row input { font-size: 0.85rem; width: 70px; }
  .cost-card {
    background: white;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border-left: 4px solid #c8763a;
  }
  .cost-card-name { font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
  .cost-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.83rem;
    padding: 3px 0;
    color: #5a4a40;
  }
  .cost-row.total {
    font-weight: bold;
    font-size: 0.95rem;
    color: #c8763a;
    border-top: 1px solid #f0e8e0;
    margin-top: 6px;
    padding-top: 8px;
  }
  .cost-row.price { font-weight: bold; font-size: 1rem; color: #4a7c59; margin-top: 4px; }
  .cost-row.profit { color: #9a7c6a; font-size: 0.8rem; }
  .cost-row.no-session { color: #b0998a; font-style: italic; }
  #admin-btn {
    position: fixed;
    bottom: 24px;
    right: 16px;
    width: 36px;
    height: 36px;
    background: rgba(200,118,58,0.12);
    border: none;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    z-index: 200;
    opacity: 0.35;
    transition: opacity .2s;
  }
  #admin-btn:active { opacity: 0.8; }
  #admin-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 400;
    align-items: center;
    justify-content: center;
  }
  #admin-modal-overlay.open { display: flex; }
  #admin-modal {
    background: #fff;
    border-radius: 14px;
    padding: 22px 20px;
    width: 300px;
    max-width: 90vw;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .cost-section { border-radius: 8px; padding: 6px 10px; margin: 5px 0; }
  .cost-section.material  { background: #fff3e8; border-left: 3px solid #c8763a; }
  .cost-section.kitchen   { background: #e8f0ff; border-left: 3px solid #5a7fc8; }
  .cost-section.packaging { background: #e8f8ee; border-left: 3px solid #4a9c6a; }
  .cost-section-title { font-size: 0.78rem; font-weight: bold; margin-bottom: 2px; }
  .cost-section.material  .cost-section-title { color: #c8763a; }
  .cost-section.kitchen   .cost-section-title { color: #5a7fc8; }
  .cost-section.packaging .cost-section-title { color: #4a9c6a; }
  .slider-wrap { margin: 4px 0 8px; }
  .slider-label { font-size: 0.85rem; color: #7a5c4a; margin-bottom: 6px; }
  .slider-label strong { color: #c8763a; font-size: 1.1rem; }
  input[type=range] { width: 100%; accent-color: #c8763a; }
  .slider-ticks { display: flex; justify-content: space-between; font-size: 0.75rem; color: #b0998a; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 32px;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-weight: bold;
    font-size: 1rem;
    color: #c8763a;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #9a7c6a; }
  .info-box {
    background: #fff8f0;
    border: 1px solid #f0d8c0;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.8rem;
    color: #7a5c4a;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .empty { text-align: center; padding: 30px; color: #b0998a; font-size: 0.9rem; }
  .badge {
    display: inline-block;
    background: #f0e8e0;
    color: #7a5c4a;
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 0.75rem;
    margin-left: 6px;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #3d2b1f;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.85rem;
    z-index: 999;
    transition: transform .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  @media (min-width: 480px) {
    .tab-btn { font-size: 0.82rem; }
    .modal-overlay { align-items: center; }
    .modal { border-radius: 20px; max-height: 80vh; }
  }
</style>
</head>
<body>

<header>
  🍪 お菓子原価計算<span>データは自動保存されます</span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('ingredients', this)">🧂 材料管理</button>
  <button class="tab-btn" onclick="switchTab('products', this)">🧁 商品管理</button>
  <button class="tab-btn" onclick="switchTab('sessions', this)">📋 生産記録</button>
  <button class="tab-btn" onclick="switchTab('costs', this)">💰 原価一覧</button>
</div>

<!-- ===== 材料管理タブ ===== -->
<div id="tab-ingredients" class="tab-panel active">

  <div id="cloud-settings-panel" style="display:none">
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        ☁️ クラウド同期
        <button onclick="lockSettings()" style="background:none;border:none;font-size:0.78rem;color:#9a7c6a;cursor:pointer">🔒 隠す</button>
      </div>
      <div id="cloud-user-info" style="font-size:0.85rem;color:#4a7c59;margin-bottom:10px;text-align:center"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn btn-primary" onclick="syncToCloud()">☁️ クラウドに保存</button>
        <button class="btn btn-secondary" onclick="syncFromCloud()">☁️ クラウドから読込</button>
      </div>
      <button class="btn btn-secondary btn-full" style="margin-top:8px;font-size:0.82rem" onclick="doSignOut()">ログアウト</button>
      <div id="cloud-status" style="font-size:0.78rem;color:#9a7c6a;margin-top:8px;text-align:center"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      食材マスター
      <button class="btn btn-primary btn-sm" onclick="openIngredientModal()">＋ 追加</button>
    </div>
    <div id="ingredient-list"><div class="empty">食材を追加してください</div></div>
  </div>
  <div class="card">
    <div class="card-title">
      包装材マスター
      <button class="btn btn-primary btn-sm" onclick="openPkgItemModal()">＋ 追加</button>
    </div>
    <div id="pkgitem-list"><div class="empty">袋・ラベル・シリカゲルなどを追加してください</div></div>
  </div>
  <div class="card">
    <div class="card-title">固定費設定</div>
    <label style="display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer">
      <input type="checkbox" id="monthly-fee-enabled" onchange="saveMonthlyFee()" style="width:18px;height:18px;cursor:pointer">
      <span>固定費を原価に含める</span>
    </label>
    <label>キッチン月額利用料（円／月）</label>
    <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
      <input type="number" id="monthly-fee" placeholder="例：11000" min="0" step="any" style="flex:1">
      <button class="btn btn-primary btn-sm" onclick="saveMonthlyFee()">保存</button>
    </div>
    <div style="font-size:0.78rem;color:#9a7c6a;margin-top:8px;line-height:1.5">
      生産記録の月ごとの総バッチ数で自動按分されます。<br>
      時間料金は生産記録に直接入力してください。
    </div>
  </div>
</div>

<!-- ===== 商品管理タブ ===== -->
<div id="tab-products" class="tab-panel">
  <div class="card">
    <div class="card-title">
      商品一覧
      <button class="btn btn-primary btn-sm" onclick="openProductModal()">＋ 追加</button>
    </div>
    <div id="product-list"><div class="empty">商品を追加してください</div></div>
  </div>
</div>

<!-- ===== 生産記録タブ ===== -->
<div id="tab-sessions" class="tab-panel">
  <div class="info-box">
    キッチンを利用するたびに記録します。利用料を作った商品の個数で自動按分し、原価に反映します。
  </div>
  <div class="card">
    <div class="card-title">
      生産記録
      <button class="btn btn-primary btn-sm" onclick="openSessionModal()">＋ 記録する</button>
    </div>
    <div id="session-list"><div class="empty">生産記録を追加してください</div></div>
  </div>
</div>

<!-- ===== 原価一覧タブ ===== -->
<div id="tab-costs" class="tab-panel">
  <div class="card">
    <div class="slider-wrap">
      <div class="slider-label">推奨販売価格の倍率：<strong id="multiplier-val">3.0</strong>倍</div>
      <input type="range" id="multiplier" min="1.5" max="5" step="0.5" value="3"
        oninput="document.getElementById('multiplier-val').textContent=parseFloat(this.value).toFixed(1);renderCosts()">
      <div class="slider-ticks"><span>1.5×</span><span>2×</span><span>2.5×</span><span>3×</span><span>3.5×</span><span>4×</span><span>4.5×</span><span>5×</span></div>
    </div>
  </div>
  <div id="cost-list">
